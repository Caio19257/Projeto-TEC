<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - BugFarm Tech</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="login-body">

    <div class="login-card">
        <div class="brand" style="border: none; margin-bottom: 1rem; justify-content: center;">
            <i class="fa-solid fa-bug"></i>
            <h1>BugFarm <span>Tech</span></h1>
        </div>
        <p style="text-align: center; color: var(--text-muted); font-size: 0.85rem; margin-bottom: 1.5rem;">
            Sistema de Rastreabilidade Sanitarista e Biotecnológica
        </p>

        <form id="loginForm">
            <div class="form-group">
                <label>Usuário / Email</label>
                <input type="text" id="username" class="form-control" placeholder="operador@bugfarm.com" required value="operador@bugfarm.com">
            </div>

            <div class="form-group">
                <label>Senha Sanitarista</label>
                <input type="password" id="password" class="form-control" placeholder="••••••••" required value="123456">
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; margin-top: 1rem;">
                <i class="fa-solid fa-right-to-bracket"></i> Acessar Painel
            </button>
        </form>
    </div>

    <script src="js/script.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const user = document.getElementById('username').value;
            localStorage.setItem(STORAGE_KEYS.USER, JSON.stringify({ email: user, name: 'Operador BioTech' }));
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
