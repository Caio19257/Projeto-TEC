<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - BugFarm Tech</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="login-body">
<script>
    const USER_KEY = (typeof STORAGE_KEYS !== 'undefined' && STORAGE_KEYS.USER) ? STORAGE_KEYS.USER : 'bugfarm_user';
    
    if (localStorage.getItem(USER_KEY)) {
        window.location.replace('index.html');
    }

    document.getElementById('loginForm').addEventListener('submit', (e) => {
        e.preventDefault();

        const userTyped = document.getElementById('username').value.trim().toLowerCase();
        const passTyped = document.getElementById('password').value.trim();
        const errorDiv = document.getElementById('loginError');

        const isUserValid = (userTyped === 'operador@bugfarm' || userTyped === 'operador@bugfarm.com');
        const isPassValid = (passTyped === '123456');

        if (isUserValid && isPassValid) {
            errorDiv.style.display = 'none';
            localStorage.setItem(USER_KEY, JSON.stringify({ email: userTyped, name: 'Operador BioTech' }));
            window.location.href = 'index.html';
        } else {
            errorDiv.style.display = 'block';
        }
    });
</script>
