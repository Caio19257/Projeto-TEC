<!DOCTYPE html>
<html lang="pt-BR">
<head> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - BugFarm Tech</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js"></script>
    <script>
        //eu tive que refazer o código inteiro, mas FINALMENTE FUNCIONOU e está melhor e menor.
        (function() {
            const userKey = (window.STORAGE_KEYS && window.STORAGE_KEYS.USER) ? window.STORAGE_KEYS.USER : "user";
            if (localStorage.getItem(userKey)) {
                window.location.replace("index.html");
            }
        })();
    </script>
</head>
<body class="login-body">
    <div class="login-container">
        <h2>BugFarm <span>Tech</span></h2>
        <form id="loginForm" onsubmit="realizarLogin(event)">
            <div class="input-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" required placeholder="seu.email@bugfarm.com">
            </div>
            <div class="input-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" required placeholder="********">
            </div>
            <button type="submit" class="btn-primary">Entrar</button>
        </form>
    </div>

    <script>
        function realizarLogin(event) {
            event.preventDefault();
            
            const userKey = (window.STORAGE_KEYS && window.STORAGE_KEYS.USER) ? window.STORAGE_KEYS.USER : "user";
            
            // Salva a sessão no localStorage
            localStorage.setItem(userKey, JSON.stringify({ email: document.getElementById('email').value, logado: true }));
            
            // Redireciona para o painel principal
            window.location.replace("index.html");
        }
    </script>
</body>
</html>
