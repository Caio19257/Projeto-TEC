<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - BugFarm Tech</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="login-body">
    <script>
  function entrar() {
    </script>
    <div class="login-card">
        <div class="brand" style="border: none; margin-bottom: 1rem; justify-content: center;">
            <i class="fa-solid fa-bug"></i>
            <h1>BugFarm <span>Tech</span></h1>
        </div>
        <p style="text-align: center; color: var(--text-muted); font-size: 0.85rem; margin-bottom: 1.5rem;">
            Sistema de Rastreabilidade Sanitarista e Biotecnológica
        </p>
        <div id="loginError" style="display: none; background: rgba(239, 68, 68, 0.2); border: 1px solid var(--accent-red); color: var(--accent-red); padding: 0.75rem; border-radius: 8px; font-size: 0.85rem; margin-bottom: 1rem; text-align: center;">
            <i class="fa-solid fa-triangle-exclamation"></i> Usuário ou senha inválidos! Acesso restrito a <strong>operador@bugfarm</strong>.
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label>Usuário / Email</label>
                <input type="text" id="username" class="form-control" required autocomplete="off">
            </div>

            <div class="form-group">
                <label>Senha Sanitarista</label>
                <input type="password" id="password" class="form-control" required>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; margin-top: 1rem;">
                <i class="fa-solid fa-right-to-bracket"></i> Acessar Painel
            </button>
        </form>
    </div>

    <script src="js/script.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            
            const userTyped = document.getElementById('username').value.trim().toLowerCase();
            const passTyped = document.getElementById('password').value.trim();
            const errorDiv = document.getElementById('loginError');

            const isUserValid = (userTyped === 'operador@bugfarm' || userTyped === 'operador@bugfarm.com');
            const isPassValid = (passTyped === '123456');

            if (isUserValid && isPassValid) {
                errorDiv.style.display = 'none';
                localStorage.setItem(STORAGE_KEYS.USER, JSON.stringify({ email: userTyped, name: 'Operador BioTech' }));
                window.location.href = 'index.html';
            } else {
                errorDiv.style.display = 'block';
            }
        });
    </script>
</body>
</html>
    localStorage.setItem("logado", "true");
    window.location.href = "index.html";
}
